name: Download logos and commit

on:
  workflow_dispatch: {}
  push:
    branches:
      - add-logos-from-issues

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install gdown
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      - name: Make download script executable
        run: chmod +x ./scripts/download-logos.sh

      - name: Run download script
        run: ./scripts/download-logos.sh
        env:
          # allow gdown to work with unauthenticated downloads
          GDOWN_NO_SSL_VERIFY: '1'

      - name: Commit downloaded assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logo || true
          if git diff --staged --quiet; then
            echo "No new or changed files to commit"
          else
            git commit -m "Add logos from issues (#2)"
            git push origin HEAD:refs/heads/add-logos-from-issues
          fi
