name: Deploy R2 Nusantara to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify Apps-R2-Nusantara mirror repository
        run: |
          echo "Main repository: $GITHUB_REPOSITORY"
          echo "Apps mirror target: gudangdistributormalang-r2nusantara/Apps-R2-Nusantara-"
          echo "Latest commit:"
          git log -1 --oneline

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
