<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>R2 Nusantara — Upgrade UI/UX</title>
  <meta name="description" content="Gudang Distributor Malang - versi UI/UX upgrade">

  <!-- Preload & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="preload" href="https://fonts.gstatic.com/s/plusjakartasans/v1/....woff2" as="font" type="font/woff2" crossorigin>

  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/components.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">R2 Nusantara</a>
      <div class="header-actions">
        <button id="darkToggle" class="btn btn-ghost" aria-label="Toggle dark mode">🌙</button>
        <a class="cart" href="/cart.html">🛒<span id="cartCount" class="badge">0</span></a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>Distribusi Berkualitas — R2 Nusantara</h1>
        <p>Upgrade toko Anda dengan tampilan yang lebih profesional dan pengalaman mobile-first.</p>
        <a class="btn btn-primary" href="#catalog">Lihat Katalog</a>
      </div>
    </section>

    <section id="catalog" class="container catalog">
      <h2>Katalog Produk</h2>
      <div class="product-grid">
        <!-- Sample product card -->
        <article class="product-card" data-id="p-001">
          <button class="btn-fav" aria-label="Tambah ke wishlist">♡</button>
          <img loading="lazy" src="/assets/images/products/sample.jpg" srcset="/assets/images/products/sample-400.jpg 400w, /assets/images/products/sample-800.jpg 800w" sizes="(max-width:600px) 100vw, 33vw" alt="Produk Sample">
          <div class="product-body">
            <h3 class="product-name">Minuman Energi — Sample</h3>
            <p class="product-price">Rp 25.000</p>
            <div class="stock-indicator" data-stock="12"></div>
            <div class="product-actions">
              <button class="btn" onclick="quickView('p-001')">Quick View</button>
              <button class="btn btn-outline" onclick="addToCart('p-001')">Tambah ke Keranjang</button>
            </div>
          </div>
        </article>

        <!-- more cards... -->
      </div>
    </section>
  </main>

  <!-- Quick View Modal -->
  <div id="quickViewModal" class="modal" aria-hidden="true"></div>

  <!-- Bottom Nav (mobile) -->
  <nav class="bottom-nav">
    <a href="/">Beranda</a>
    <a href="/catalog">Katalog</a>
    <a href="/cart.html">Keranjang</a>
    <a href="/account">Akun</a>
  </nav>

  <script defer src="/assets/js/cart.js"></script>
  <script defer src="/assets/js/app.js"></script>

  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function(err){ console.warn('SW failed', err); });
      });
    }
  </script>
</body>
</html>
